<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全台案例分布示意｜升揚消防</title>
<style>
  :root{
    --ink:#1d2b3a; --muted:#6b7785; --line:#e3e8ed; --bg:#ffffff; --soft:#f5f7f9;
    --brand:#d7262f; --navy:#12355b;
    --c-rest:#e0452f; --c-hotel:#1f74c4; --c-mall:#2e9e57; --c-school:#7a5cc2; --c-care:#14929a; --c-other:#7c8790;
    --land:#eef1f4; --land-line:#c3ccd5; --land-hi:#dbe9f7; --land-sel:#fde3e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 28px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--brand);padding-bottom:12px}
  h1{margin:0;font-size:28px;letter-spacing:.06em;color:var(--navy)}
  .eng{margin:2px 0 0;font-size:12px;letter-spacing:.32em;color:var(--muted);font-weight:700}
  .stats{display:flex;gap:18px;flex-wrap:wrap}
  .stat{text-align:right}
  .stat b{display:block;font-size:26px;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted);letter-spacing:.08em}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .chip em{font-style:normal;color:var(--muted);font-size:12px}
  .chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
  .chip[aria-pressed="false"]{opacity:.55}
  .chip:hover{opacity:1}
  .search{flex:1;min-width:180px;max-width:280px;margin-left:auto;position:relative}
  .search input{width:100%;font:inherit;font-size:14px;padding:7px 12px 7px 32px;border:1.5px solid var(--line);border-radius:999px;outline:none}
  .search input:focus{border-color:var(--navy)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
  main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
  .mapbox{position:relative;background:var(--soft);border-radius:14px;padding:8px}
  svg.map{width:100%;height:auto;display:block}
  .county{fill:var(--land);stroke:var(--land-line);stroke-width:.8;transition:fill .2s}
  .county.in{fill:var(--land-hi);cursor:pointer}
  .county.sel{fill:var(--land-sel)}
  .county.in:hover{fill:#cfe1f4}
  .county.sel:hover{fill:#fbd3cf}
  .pin{cursor:pointer}
  .pin circle.dot{fill:var(--navy);stroke:#fff;stroke-width:2.5;transition:.2s}
  .pin.sel circle.dot,.pin:hover circle.dot{fill:var(--brand)}
  .pin.empty{opacity:.35}
  .pin text.lbl{font-size:15px;font-weight:800;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .pin.sel text.lbl{fill:var(--brand)}
  .pin text.n{font-size:11px;font-weight:800;fill:#fff;text-anchor:middle}
  .pulse{fill:none;stroke:var(--brand);stroke-width:2;opacity:0}
  .pin.sel .pulse{animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{r:11;opacity:.7}100%{r:26;opacity:0}}
  .inset rect{fill:#fff;stroke:var(--land-line);stroke-dasharray:3 3}
  .inset text{font-size:11px;fill:var(--muted)}
  .north{font-size:12px;font-weight:800;fill:var(--muted)}
  .tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
  .tip.on{opacity:1}
  .panel{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;max-height:720px}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--navy);color:#fff}
  .ph h2{margin:0;font-size:18px;letter-spacing:.06em}
  .ph small{opacity:.8;font-size:12px}
  .ph button{font:inherit;font-size:13px;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:3px 11px;cursor:pointer}
  .ph button[hidden]{display:none}
  .list{overflow:auto;padding:6px 16px 14px}
  .grp{margin-top:12px}
  .grp h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;color:var(--navy);letter-spacing:.06em;cursor:pointer}
  .grp h3 .cnt{font-size:12px;color:var(--muted);font-weight:600}
  .grp h3 .note{font-size:11px;color:var(--muted);font-weight:500}
  ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:4px 12px}
  li{display:flex;align-items:center;gap:7px;font-size:14px;padding:3px 0}
  li i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
  li mark{background:#ffe8a3;color:inherit;border-radius:2px}
  .empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
  footer{margin-top:14px;font-size:12px;color:var(--muted)}
  @media (max-width:720px){
    main{grid-template-columns:1fr}
    .panel{max-height:none}
    h1{font-size:23px}
    .search{max-width:none;margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>全台案例分布示意</h1>
      <p class="eng">PROJECT REFERENCES</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tools">
    <div id="chips" style="display:contents"></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋案例名稱，例如：三井、國小" aria-label="搜尋案例"></label>
  </div>

  <main>
    <div class="mapbox">
      <svg class="map" id="map" viewBox="0 0 500 690" role="img" aria-label="台灣案例分布地圖"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <section class="panel" aria-live="polite">
      <div class="ph"><div><h2 id="ptitle">全部地區</h2><small id="psub"></small></div><button id="all" hidden>顯示全部地區</button></div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer>地圖為區域示意，非實際地址定位；未註明地點之餐廳集中於北部示意。點選地圖上的區域或標記，可查看該區案例。</footer>
</div>

  svg.addEventListener('click', e => {
    const p = e.target.closest('[data-region]');
    if (p && p.dataset.region) pick(p.dataset.region);
  });
  svg.addEventListener('mousemove', e => {
    const p = e.target.closest('[data-region]'), tip = $('tip');
    if (!p || !p.dataset.region){ tip.classList.remove('on'); return; }
    const r = REGIONS[p.dataset.region], n = shown().filter(c => c.region === p.dataset.region).length;
    const box = $('map').parentElement.getBoundingClientRect();
    tip.textContent = `${r.name}　${n} 件案例`;
    tip.style.left = (e.clientX - box.left) + 'px'; tip.style.top = (e.clientY - box.top) + 'px';
    tip.classList.add('on');
  });
  svg.addEventListener('mouseleave', () => $('tip').classList.remove('on'));
}
function drawPins(){
  const list = shown();
  let s = '';
  for (const [k, r] of Object.entries(REGIONS)){
    if (!r.at) continue;
    const n = list.filter(c => c.region === k).length, [x, y] = r.at, [dx, dy, an] = r.lbl;
    s += `<g class="pin${st.region === k ? ' sel' : ''}${n ? '' : ' empty'}" data-region="${k}" tabindex="0" role="button" aria-label="${r.name} ${n} 件">
      <circle class="pulse" cx="${x}" cy="${y}" r="11"/>
      <circle class="dot" cx="${x}" cy="${y}" r="${n > 9 ? 13 : 11}"/>
      <text class="n" x="${x}" y="${y + 4}">${n}</text>
      <text class="lbl" x="${x + dx}" y="${y + dy}" text-anchor="${an}">${r.name}</text></g>`;
  }
  $('pins').innerHTML = s;
  document.querySelectorAll('.county.in').forEach(p => p.classList.toggle('sel', p.dataset.region === st.region));
}

/* ---------- controls ---------- */
function drawChips(){
  const all = CASES.filter(c => !st.q || c.name.toLowerCase().includes(st.q.toLowerCase()));
  $('chips').innerHTML = Object.entries(CATS).map(([k, c]) =>
    `<button class="chip" style="--c:${c.color}" data-cat="${k}" aria-pressed="${st.cats.has(k)}"><i></i>${c.name}<em>${all.filter(x => x.cat === k).length}</em></button>`).join('');
}
function drawStats(){
  const n = k => CASES.filter(c => c.cat === k).length;
  const items = [['案例總數', CASES.length], ['餐廳', n('rest')], ['飯店', n('hotel')], ['商場', n('mall')], ['學校／其他', n('school') + n('care') + n('other')]];
  $('stats').innerHTML = items.map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}
function hl(name){
  if (!st.q) return esc(name);
  const i = name.toLowerCase().indexOf(st.q.toLowerCase());
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + st.q.length)) + '</mark>' + esc(name.slice(i + st.q.length));
}
function drawList(){
  const list = shown(), keys = st.region ? [st.region] : Object.keys(REGIONS);
  const r = st.region && REGIONS[st.region];
  $('ptitle').textContent = r ? r.name : '全部地區';
  $('psub').textContent = `${(st.region ? list.filter(c => c.region === st.region) : list).length} 件案例` + (r && r.note ? `・${r.note}` : '');
  $('all').hidden = !st.region;
  let s = '';
  for (const k of keys){
    const reg = REGIONS[k], items = list.filter(c => c.region === k);
    if (!items.length) continue;
    s += `<div class="grp"><h3 data-go="${k}">${reg.name}<span class="cnt">${items.length}</span>${!st.region && reg.note ? `<span class="note">${reg.note}</span>` : ''}</h3>`;
    for (const [ck, cat] of Object.entries(CATS)){
      const sub = items.filter(c => c.cat === ck);
      if (!sub.length) continue;
      s += `<ul aria-label="${cat.name}">` + sub.map(c => `<li style="--c:${cat.color}" title="${cat.name}"><i></i><span>${hl(c.name)}</span></li>`).join('') + '</ul>';
    }
    s += '</div>';
  }
  $('list').innerHTML = s || '<p class="empty">沒有符合條件的案例</p>';
  $('list').scrollTop = 0;
}
function render(){ drawChips(); drawPins(); drawList(); }
function pick(k){ st.region = st.region === k ? null : k; render(); }

$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  const k = b.dataset.cat;
  // first click on a category while all are on: show only that one; otherwise toggle; never leave none
  if (st.cats.size === Object.keys(CATS).length) st.cats = new Set([k]);
  else if (st.cats.has(k)) { st.cats.delete(k); if (!st.cats.size) st.cats = new Set(Object.keys(CATS)); }
  else st.cats.add(k);
  render();
});
$('q').addEventListener('input', e => { st.q = e.target.value.trim(); render(); });
$('all').addEventListener('click', () => { st.region = null; render(); });
$('list').addEventListener('click', e => { const h = e.target.closest('[data-go]'); if (h && REGIONS[h.dataset.go].at) pick(h.dataset.go); });
$('map').addEventListener('keydown', e => { const p = e.target.closest('.pin'); if (p && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pick(p.dataset.region); } });

drawMap(); drawStats(); render();
const q0 = new URLSearchParams(location.search);
if (q0.get('region') && REGIONS[q0.get('region')]) pick(q0.get('region'));
</script>
</body>
</html>
